<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LucidDetox - Taste the Astral. Reality check reminders for lucid dreaming practice.">
  <meta name="theme-color" content="#581c87">
  <title>LucidDetox - Taste the Astral</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';

    const Play = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );

    const Pause = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    );

    const Bell = ({ className = "", size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    );

    const Volume2 = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    );

    const LucidDetox = () => {
      const [isActive, setIsActive] = useState(false);
      const [intervalMinutes, setIntervalMinutes] = useState(30);
      const [randomize, setRandomize] = useState(true);
      const [volume, setVolume] = useState(70);
      const [chimeType, setChimeType] = useState('bell');
      const [lastChime, setLastChime] = useState(null);
      const [nextChime, setNextChime] = useState(null);
      
      const audioContextRef = useRef(null);
      const nextChimeTimeRef = useRef(null);
      const checkIntervalRef = useRef(null);

      useEffect(() => {
        audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
        
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('service-worker.js');
        }
        
        return () => {
          if (audioContextRef.current) {
            audioContextRef.current.close();
          }
        };
      }, []);

      const playChime = () => {
        if (!audioContextRef.current) return;
        
        const ctx = audioContextRef.current;
        const now = ctx.currentTime;
        const gainNode = ctx.createGain();
        gainNode.gain.value = volume / 100 * 0.3;
        gainNode.connect(ctx.destination);

        if (chimeType === 'bell') {
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            osc.frequency.value = freq;
            osc.type = 'sine';
            
            const oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.3, now + i * 0.15);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 1.5);
            
            osc.connect(oscGain);
            oscGain.connect(gainNode);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 1.5);
          });
        } else if (chimeType === 'bowl') {
          const osc = ctx.createOscillator();
          osc.frequency.value = 432;
          osc.type = 'sine';
          
          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0.5, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 3);
          
          osc.connect(oscGain);
          oscGain.connect(gainNode);
          osc.start(now);
          osc.stop(now + 3);
        } else if (chimeType === 'gong') {
          const osc = ctx.createOscillator();
          osc.frequency.value = 220;
          osc.type = 'triangle';
          
          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0.6, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 4);
          
          osc.connect(oscGain);
          oscGain.connect(gainNode);
          osc.start(now);
          osc.stop(now + 4);
        } else if (chimeType === 'crystal') {
          [1046.5, 1318.5, 1568].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            osc.frequency.value = freq;
            osc.type = 'sine';
            
            const oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.2, now + i * 0.1);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 2);
            
            osc.connect(oscGain);
            oscGain.connect(gainNode);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 2);
          });
        } else if (chimeType === 'zen') {
          const osc = ctx.createOscillator();
          osc.frequency.value = 528;
          osc.type = 'sine';
          
          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0.4, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 2);
          
          osc.connect(oscGain);
          oscGain.connect(gainNode);
          osc.start(now);
          osc.stop(now + 2);
        }

        setLastChime(new Date());
      };

      const getNextChimeDelay = () => {
        if (randomize) {
          const min = intervalMinutes * 0.5;
          const max = intervalMinutes * 1.5;
          return (Math.random() * (max - min) + min) * 60 * 1000;
        }
        return intervalMinutes * 60 * 1000;
      };

      const scheduleNextChime = () => {
        const delay = getNextChimeDelay();
        nextChimeTimeRef.current = Date.now() + delay;
        setNextChime(new Date(nextChimeTimeRef.current));
      };

      useEffect(() => {
        if (!isActive) {
          if (checkIntervalRef.current) {
            clearInterval(checkIntervalRef.current);
          }
          setNextChime(null);
          nextChimeTimeRef.current = null;
          return;
        }

        scheduleNextChime();

        checkIntervalRef.current = setInterval(() => {
          if (nextChimeTimeRef.current && Date.now() >= nextChimeTimeRef.current) {
            playChime();
            scheduleNextChime();
          }
        }, 1000);

        return () => {
          if (checkIntervalRef.current) {
            clearInterval(checkIntervalRef.current);
          }
        };
      }, [isActive]);

      const formatTime = (date) => {
        if (!date || isNaN(date.getTime())) return '--:--';
        return date.toLocaleTimeString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit',
          hour12: true 
        });
      };

      const getTimeUntil = (date) => {
        if (!date || isNaN(date.getTime())) return '';
        const diff = date - new Date();
        if (diff < 0) return '0m 0s';
        const minutes = Math.floor(diff / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        return `${minutes}m ${seconds}s`;
      };

      const [timeUntil, setTimeUntil] = useState('');

      useEffect(() => {
        const timer = setInterval(() => {
          if (nextChime) {
            setTimeUntil(getTimeUntil(nextChime));
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [nextChime]);

      return React.createElement('div', { className: "min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 p-4 flex items-center justify-center" },
        React.createElement('div', { className: "max-w-md w-full bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-2xl p-8 shadow-2xl border border-purple-500 border-opacity-30" },
          React.createElement('div', { className: "text-center mb-8" },
            React.createElement(Bell, { className: "w-16 h-16 mx-auto mb-4 text-purple-400", size: 64 }),
            React.createElement('h1', { className: "text-3xl font-bold text-white mb-2" }, 'LucidDetox'),
            React.createElement('p', { className: "text-purple-300 text-sm italic mb-1" }, 'Taste the Astral'),
            React.createElement('p', { className: "text-purple-400 text-xs" }, 'Reality Check Reminders')
          ),

          React.createElement('div', { className: "bg-gray-800 rounded-lg p-6 mb-6 border border-purple-500 border-opacity-20" },
            React.createElement('div', { className: "text-center mb-4" },
              React.createElement('div', { className: "text-sm text-purple-300 mb-1" }, 'Status'),
              React.createElement('div', { className: `text-2xl font-bold ${isActive ? 'text-green-400' : 'text-gray-500'}` },
                isActive ? 'Active' : 'Paused'
              )
            ),

            isActive && nextChime && React.createElement('div', { className: "text-center mb-4" },
              React.createElement('div', { className: "text-sm text-purple-300 mb-1" }, 'Next Chime'),
              React.createElement('div', { className: "text-xl font-semibold text-white" }, formatTime(nextChime)),
              React.createElement('div', { className: "text-sm text-purple-400" }, timeUntil)
            ),

            React.createElement('div', { className: "text-center" },
              React.createElement('div', { className: "text-xs text-purple-300 mb-1" }, 'Last Chime'),
              React.createElement('div', { className: "text-sm font-semibold text-white" },
                lastChime ? formatTime(lastChime) : 'None'
              )
            )
          ),

          React.createElement('div', { className: "mb-6" },
            React.createElement('label', { className: "text-white text-sm font-semibold mb-3 block" }, 'Chime Sound'),
            React.createElement('div', { className: "grid grid-cols-3 gap-2" },
              [
                { id: 'bell', name: 'Bell', emoji: '🔔' },
                { id: 'bowl', name: 'Bowl', emoji: '🎵' },
                { id: 'gong', name: 'Gong', emoji: '⚫' },
                { id: 'crystal', name: 'Crystal', emoji: '💎' },
                { id: 'zen', name: 'Zen', emoji: '🧘' }
              ].map(type =>
                React.createElement('button', {
                  key: type.id,
                  onClick: () => setChimeType(type.id),
                  className: `p-3 rounded-lg font-semibold transition-all ${
                    chimeType === type.id
                      ? 'bg-purple-600 text-white scale-105'
                      : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                  }`
                },
                  React.createElement('div', { className: "text-2xl mb-1" }, type.emoji),
                  React.createElement('div', { className: "text-xs" }, type.name)
                )
              )
            )
          ),

          React.createElement('div', { className: "mb-6" },
            React.createElement('label', { className: "text-white text-sm font-semibold mb-2 block" },
              `Base Interval: ${intervalMinutes} minutes`
            ),
            React.createElement('input', {
              type: "range",
              min: "5",
              max: "120",
              step: "5",
              value: intervalMinutes,
              onChange: (e) => setIntervalMinutes(parseInt(e.target.value)),
              className: "w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
            }),
            React.createElement('div', { className: "flex justify-between text-xs text-purple-300 mt-1" },
              React.createElement('span', null, '5 min'),
              React.createElement('span', null, '120 min')
            )
          ),

          React.createElement('div', { className: "mb-6" },
            React.createElement('label', { className: "flex items-center justify-between cursor-pointer" },
              React.createElement('span', { className: "text-white text-sm font-semibold" }, 'Randomize Timing'),
              React.createElement('div', { className: "relative" },
                React.createElement('input', {
                  type: "checkbox",
                  checked: randomize,
                  onChange: (e) => setRandomize(e.target.checked),
                  className: "sr-only"
                }),
                React.createElement('div', { className: `w-14 h-7 rounded-full transition-colors ${randomize ? 'bg-purple-600' : 'bg-gray-700'}` },
                  React.createElement('div', { className: `w-5 h-5 bg-white rounded-full mt-1 transition-transform ${randomize ? 'translate-x-8' : 'translate-x-1'}` })
                )
              )
            ),
            React.createElement('p', { className: "text-xs text-purple-300 mt-2" },
              randomize ? '50-150% of base interval (less predictable)' : 'Fixed interval timing'
            )
          ),

          React.createElement('div', { className: "mb-6" },
            React.createElement('label', { className: "text-white text-sm font-semibold mb-2 flex items-center gap-2" },
              React.createElement(Volume2, { size: 16 }),
              `Volume: ${volume}%`
            ),
            React.createElement('input', {
              type: "range",
              min: "10",
              max: "100",
              value: volume,
              onChange: (e) => setVolume(parseInt(e.target.value)),
              className: "w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
            })
          ),

          React.createElement('button', {
            onClick: playChime,
            className: "w-full bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg mb-4 transition-colors flex items-center justify-center gap-2"
          },
            React.createElement(Volume2, { size: 18 }),
            'Test Chime'
          ),

          React.createElement('button', {
            onClick: () => setIsActive(!isActive),
            className: `w-full font-bold py-4 px-6 rounded-lg flex items-center justify-center gap-3 text-lg transition-all ${
              isActive
                ? 'bg-red-600 hover:bg-red-700 text-white'
                : 'bg-purple-600 hover:bg-purple-700 text-white'
            }`
          },
            isActive 
              ? [React.createElement(Pause, { key: 'icon' }), 'Stop Chimes']
              : [React.createElement(Play, { key: 'icon' }), 'Start Chimes']
          ),

          React.createElement('div', { className: "mt-6 bg-purple-900 bg-opacity-30 rounded-lg p-4 border border-purple-500 border-opacity-20" },
            React.createElement('h3', { className: "text-purple-300 font-semibold text-sm mb-2" }, '💡 Tips'),
            React.createElement('ul', { className: "text-purple-200 text-xs space-y-1" },
              React.createElement('li', null, '• When chime sounds, do a reality check (nose pinch, hand check, etc.)'),
              React.createElement('li', null, '• Random timing prevents anticipation (better for training)'),
              React.createElement('li', null, '• Use throughout the day to build the habit'),
              React.createElement('li', null, '• Quieter chimes work better in public/work settings')
            )
          )
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(LucidDetox));
  </script>
</body>
</html>
